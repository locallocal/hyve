name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze, test, and build Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - name: Set up pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
          pub-cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-:hash:"

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify localization catalogs and generated sources
        run: |
          dart run tool/sync_localizations.dart --check
          dart run intl_utils:generate
          git diff --exit-code -- lib/generated

      - name: Check non-generated formatting
        run: dart run tool/check_format.dart

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Verify architecture boundaries
        run: flutter test test/architecture

      - name: Verify current database contract
        run: flutter test test/data/services/database_service_test.dart

      - name: Run all tests
        run: flutter test

      - name: Build Linux release
        run: flutter build linux --release
